name: Windows build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore FlowForge.sln

      - name: Check NuGet advisories
        shell: pwsh
        run: |
          $audit = dotnet list FlowForge.csproj package --vulnerable --include-transitive | Out-String
          Write-Host $audit
          if ($LASTEXITCODE -ne 0) {
            throw "NuGet vulnerability audit failed."
          }
          if ($audit -match "has the following vulnerable packages") {
            throw "A vulnerable NuGet dependency was found."
          }

      - name: Run tests
        run: dotnet test FlowForge.sln --configuration Debug --no-restore

      - name: Publish self-contained Windows build
        run: dotnet publish FlowForge.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --output artifacts\FlowForge-win-x64

      - name: Upload publish folder
        uses: actions/upload-artifact@v4
        with:
          name: FlowForge-win-x64
          path: artifacts\FlowForge-win-x64\
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release exe
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        run: Copy-Item artifacts\FlowForge-win-x64\FlowForge.exe FlowForge.exe

      - name: Create GitHub release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FlowForge.exe
          generate_release_notes: true

      - name: Create GitHub release (every push to master)
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FlowForge v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: FlowForge.exe
          generate_release_notes: true
          make_latest: true
